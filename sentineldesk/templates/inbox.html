<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket inbox · SentinelDesk</title><link rel="stylesheet" href="/static/console.css?v=case-layout-2"><link rel="stylesheet" href="/static/inbox.css?v=desk-2"></head><body>
<header class="top">
  <a class="brand" href="/inbox">
    <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
    <h1><span class="brace">{</span>SentinelDesk<span class="brace">}</span></h1>
    <span class="tagline">Support workspace</span>
  </a>
  <a class="pill blue" href="/">Triage console ↗</a>
</header>
<main class="inbox-layout">
  <aside class="panel queue">
    <div class="inbox-title"><h2>Ticket inbox</h2><button id="new-ticket" class="new-ticket">+ New ticket</button></div>
    <label class="visually-hidden" for="filter">Search tickets</label>
    <input id="filter" type="search" placeholder="Search tickets or IDs">
    <div class="queue-tools"><select id="view" aria-label="Filter by ticket status">
      <option value="all">All tickets</option><option value="new">New</option><option value="draft_ready">Draft ready</option>
      <option value="review">In review</option><option value="escalate">Escalated</option>
      <option value="needs_clarification">Needs clarification</option><option value="resolved">Resolved</option>
    </select><span id="count" class="small muted"></span></div>
    <nav aria-label="Ticket queue" id="list"></nav>
  </aside>
  <section class="reader panel" aria-label="Selected ticket">
    <p id="no-selection" hidden>Select a different filter or create a ticket.</p>
    <div id="workspace">
      <div class="toolbar"><span id="ref"></span><span id="status" class="pill" role="status">Loading…</span></div>
      <h2 id="subject"></h2>
      <div class="actions"><button id="run" disabled>Run triage</button><button id="resolve" hidden></button></div>
      <p id="error" role="alert"></p>
      <div class="desk-columns">
        <div class="conversation">
          <h3>Customer message</h3><p class="message" id="body"></p>
          <section id="compose" hidden><h3>Reply draft</h3><label class="visually-hidden" for="reply">Reply to customer</label><textarea id="reply" rows="7"></textarea>
          <label for="recipient">Recipient email (optional)</label><input id="recipient" type="email" placeholder="Enter an email or add it in Gmail"><button id="gmail">Open in Gmail ↗</button></section>
          <section id="history" hidden><h3>Related tickets</h3><div id="evidence"></div></section>
        </div>
        <aside class="properties"><h3>Ticket details</h3><dl id="labels"></dl><section id="result" hidden><h3>Routing decision</h3><p id="reason"></p></section></aside>
      </div>
    </div>
  </section>
</main>
<dialog id="create-dialog"><form id="create-form"><h2>New ticket</h2><label for="new-subject">Subject</label><input id="new-subject" maxlength="500" autofocus>
<label for="new-body">Customer message</label><textarea id="new-body" rows="5" required></textarea><div class="form-row"><button type="submit">Create ticket</button><button type="button" id="cancel">Cancel</button></div></form></dialog>
<script src="/static/inbox.js?v=desk-2" defer></script></body></html>
